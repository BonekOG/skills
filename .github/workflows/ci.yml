name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  cross-platform:
    name: validate-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: python3
          - os: macos-latest
            python: python3
          - os: windows-2022
            python: python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run repository checks for this OS
        run: >-
          ${{ matrix.python }} scripts/check-local.py --base
          "${{ github.event.pull_request.base.sha || 'origin/main' }}"
          ${{ contains(github.event.pull_request.labels.*.name, 'skill-version-reset') && '--allow-skill-version-reset' || '' }}

  validate:
    name: validate
    needs: cross-platform
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm cross-platform validation
        run: echo "All platform checks passed."
